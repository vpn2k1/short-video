<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chỉnh sửa video · AI Video Studio</title>
<!-- Tailwind cho class mà composition dùng (Captions, TitleCard…) — build lúc chạy -->
<link rel="stylesheet" href="/editor/tailwind.css" />
<style>
  :root {
    --bg: #0e0f12; --panel: #17181c; --panel-2: #222328; --line: #2a2b31; --line-2: #3a3c44;
    --text: #e8ecf2; --muted: #8a93a3; --accent: #ff7a1a; --accent-ink: #1a0d00;
    --ok: #3fb950; --err: #ff6b6b;
    --c-scene: #3b4a6b; --c-caption: #6b4ea0; --c-voice: #2f6f5e; --c-music: #7a5b22; --c-clip: #2d6a86;
    --c-overlay: #2f5c8f;
  }
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 4px; padding: 0 4px; }

  .ed-center { height: 100%; display: grid; place-content: center; gap: 14px; text-align: center; color: var(--muted); }
  /* minmax(0, 1fr): timeline dài không được nới rộng cả trang — nó tự cuộn ngang trong .tl-scroll */
  .ed { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
  .ed > * { min-width: 0; }

  /* ---------- thanh trên ---------- */
  .ed-top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px;
            padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .ed-top-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .ed-top-r { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
  .ed-title { min-width: 0; max-width: 46vw; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
  .ed-icon { width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--text);
             display: inline-grid; place-items: center; font-size: 16px; padding: 0; }
  .ed-icon:hover { background: var(--panel-2); border-color: var(--line); }
  .ed-export { padding: 8px 18px; font-size: 14px; }
  /* hộp phím tắt */
  .ed-card.ed-keys { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .ed-keys-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .ed-keys-head h3 { margin: 0; }
  .ed-keys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4px 24px; }
  .ed-keys h4 { margin: 14px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .ed-keys ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
  .ed-keys li { display: grid; grid-template-columns: 118px minmax(0, 1fr); align-items: center; gap: 10px; }
  .ed-keys li span { display: flex; gap: 3px; flex-wrap: wrap; }
  .ed-keys kbd { font-size: 11.5px; padding: 1px 6px; color: var(--text); }
  .ed-keys > .muted { margin: 14px 0 0; font-size: 12px; }
  .ed-title b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .save { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .save.saved { color: var(--ok); }
  .save.error { color: var(--err); }
  .ed-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px;
            border: 1px solid var(--line); background: var(--panel); font-size: 13px; text-decoration: none;
            color: var(--text); white-space: nowrap; }
  .ed-btn:hover { border-color: var(--line-2); }
  .ed-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .ed-btn.ghost { background: transparent; }

  /* ---------- 3 cột ---------- */
  .ed-main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; min-height: 0; }
  /* Thư viện bên phải: đổi thứ tự cột, bảng thuộc tính sang trái */
  .ed-main.lib-right .md { order: 3; border-right: 0; border-left: 1px solid var(--line); }
  .ed-main.lib-right .ed-stage { order: 2; }
  .ed-main.lib-right .ed-insp { order: 1; border-left: 0; border-right: 1px solid var(--line); }
  .ed-stage { min-height: 0; display: flex; flex-direction: column; background: #08090b; overflow: hidden; }
  .ed-view { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; padding: 14px 14px 8px; }
  .ed-pbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px;
             padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .ed-tc { font: 12.5px ui-monospace, Menlo, monospace; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ed-tc b { color: var(--accent); font-weight: 600; }
  .ed-play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--text); color: #0e0f12;
             display: grid; place-items: center; padding: 0; }
  .ed-play:hover { background: #fff; transform: scale(1.05); }
  .ed-pbar-r { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .ed-ratio { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .ed-player { height: 100%; max-width: 100%; max-height: 100%; background: #000; border-radius: 8px; overflow: hidden;
               box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .ed-insp { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; background: var(--panel); }
  .ed-player { position: relative; }

  /* ---------- kéo văn bản trên khung xem trước ---------- */
  .stage-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .stage-text { position: absolute; transform: translate(-50%, -50%); width: max-content; white-space: pre-wrap;
                overflow-wrap: break-word; line-height: 1.2; color: transparent; pointer-events: auto; cursor: move;
                outline: 1px dashed rgba(255,255,255,.0); outline-offset: 4px; border-radius: 4px; user-select: none;
                touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .stage-overlay:hover .stage-text { outline-color: rgba(255,255,255,.45); }
  .stage-text.on { outline: 2px solid var(--accent) !important; }
  .guide { position: absolute; background: #3ee6ff; pointer-events: none; opacity: .8; }
  .guide.v { left: 50%; top: 0; bottom: 0; width: 1px; }
  .guide.h { top: 50%; left: 0; right: 0; height: 1px; }
  .stage-caption { cursor: move; }
  /* khung bọc chữ của mục đang chọn — rộng đúng bằng bề rộng tối đa, tay nắm hai bên để kéo */
  .stage-wrap { position: absolute; top: -6px; bottom: -6px; left: 50%; transform: translateX(-50%);
                border: 1px dashed #3ee6ff; border-radius: 4px; pointer-events: none; }
  .stage-handle { position: absolute; top: 50%; width: 10px; height: 24px; margin-top: -12px; background: #fff;
                  border: 1px solid #3ee6ff; border-radius: 3px; pointer-events: auto; cursor: ew-resize; touch-action: none; }
  .stage-handle.l { left: -6px; }
  .stage-handle.r { right: -6px; }

  /* khối của lớp video chồng: kéo thân để dời, 4 góc để thu phóng, tay nắm trên để xoay */
  .stage-pip { position: absolute; pointer-events: auto; cursor: move; touch-action: none;
               outline: 1px dashed rgba(255,255,255,0); outline-offset: -1px; }
  .stage-overlay:hover .stage-pip { outline-color: rgba(255,255,255,.4); }
  .stage-pip.on { outline: 2px solid #3ee6ff; outline-offset: -1px; }
  /* Tay nắm nằm gần như hoàn toàn TRONG khối: .stage-overlay cắt phần tràn ra ngoài khung xem trước,
     nên lớp phủ kín khung mà đặt tay nắm ở ngoài thì bấm không được. */
  .stage-pip-h { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid #3ee6ff; border-radius: 3px;
                 pointer-events: auto; touch-action: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .stage-pip-h.nw { left: -2px; top: -2px; cursor: nwse-resize; }
  .stage-pip-h.ne { right: -2px; top: -2px; cursor: nesw-resize; }
  .stage-pip-h.se { right: -2px; bottom: -2px; cursor: nwse-resize; }
  .stage-pip-h.sw { left: -2px; bottom: -2px; cursor: nesw-resize; }
  .stage-pip-rot { position: absolute; left: 50%; top: 6px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
                   background: #fff; border: 2px solid #3ee6ff; pointer-events: auto; cursor: grab; touch-action: none;
                   box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  /* mũi tên xoay vẽ bằng CSS — phân biệt với 4 tay nắm vuông ở góc */
  .stage-pip-rot::after { content: ""; position: absolute; inset: 3px; border: 2px solid #1a6b7a;
                          border-radius: 50%; border-top-color: transparent; }
  .in-seg { display: flex; gap: 4px; margin: 4px 0 10px; }
  .in-seg button { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 12px; color: var(--muted); }
  .in-seg button.on { border-color: var(--accent); color: var(--text); background: rgba(255,122,26,.12); }
  .in-size { display: flex; align-items: center; gap: 8px; }
  .in-size input[type="range"] { flex: 1; min-width: 0; }
  .in-size input[type="number"] { width: 64px; }

  /* nút tách audio ngay trên khối cảnh đang chọn */
  .blk-act { position: relative; z-index: 2; margin-left: auto; margin-right: 12px; background: rgba(0,0,0,.6); color: #fff;
             border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 1px 7px; font-size: 11px; white-space: nowrap; cursor: pointer; }
  .blk-act:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* kiểu phụ đề kiểu CapCut */
  .in-scope { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
  .in-scope button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .in-scope button.on { border-color: var(--accent); color: var(--text); background: rgba(255,122,26,.12); }
  .cap-pick { margin-bottom: 10px; }
  .cap-pick-bar { display: flex; gap: 4px; margin-bottom: 6px; }
  .cap-pick-bar button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; }
  .cap-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  .cap-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cap-item:last-child { border-bottom: 0; }
  .cap-item.current { background: rgba(255,122,26,.08); }
  .cap-item b { color: var(--muted); min-width: 18px; font-weight: 600; }
  .cap-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-item i { color: var(--accent); font-style: normal; font-size: 10px; }
  .cap-item input { accent-color: var(--accent); }
  .cap-controls { border: 0; margin: 0; padding: 0; min-width: 0; }
  .cap-controls:disabled { opacity: .45; }
  .cap-controls > .in-label { display: block; margin: 8px 0 4px; }
  .cap-templates, .cap-presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 6px; }
  .cap-templates button, .cap-presets button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
                                               padding: 7px 2px 4px; background: #3a3f48; border: 1px solid var(--line); border-radius: 8px; }
  .cap-templates button:hover, .cap-presets button:hover { border-color: var(--line-2); }
  .cap-presets button.on { border-color: var(--accent); }
  .cap-templates small, .cap-presets small { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .in-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .in-presets button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .in-presets button:hover { border-color: var(--line-2); }
  .ed-progress.busy div { animation: busy 1.1s ease-in-out infinite alternate; }
  @keyframes busy { from { margin-left: 0; } to { margin-left: 65%; } }

  /* ---------- thư viện media ---------- */
  /* Tab ngang có biểu tượng ở đầu thư viện — như hàng Media / Audio / Text của CapCut */
  .md { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--panel); }
  .md-rail { display: flex; gap: 2px; padding: 6px 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .md-rail::-webkit-scrollbar { display: none; }
  .md-rail button { flex: 1 1 0; min-width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; border: 0;
                    border-radius: 9px; padding: 6px 2px 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; position: relative; }
  .md-rail button span { font-size: 18px; line-height: 1.1; font-weight: 800; }
  .md-rail button:hover { color: var(--text); background: var(--panel-2); }
  .md-rail button.on { color: var(--text); }
  .md-rail button.on::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -6px; height: 2px; border-radius: 2px; background: var(--accent); }
  .md-body { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; padding-top: 6px; }
  .md-dropzone { position: absolute; inset: 6px; z-index: 5; display: grid; place-items: center; border: 2px dashed var(--accent);
                 border-radius: 12px; background: rgba(255,122,26,.1); color: var(--text); font-weight: 600; pointer-events: none; }
  .md-import { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; aspect-ratio: 1;
               border: 1.5px dashed var(--line-2); border-radius: 10px; background: var(--panel-2); color: var(--text); padding: 6px; text-align: center; }
  .md-import b { font-size: 26px; font-weight: 300; line-height: 1; color: var(--accent); }
  .md-import span { font-size: 12.5px; font-weight: 600; }
  .md-import small { font-size: 10.5px; color: var(--muted); }
  .md-import:hover:not(:disabled) { border-color: var(--accent); background: rgba(255,122,26,.08); }
  .md-import.row { aspect-ratio: auto; flex-direction: row; gap: 10px; padding: 10px; margin: 2px 0 8px; }
  .md-import.row b { font-size: 20px; }
  .md-tile[draggable="true"] { cursor: grab; }
  .md-tile-add { position: absolute; right: 5px; bottom: 5px; width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0;
                 background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; line-height: 26px;
                 box-shadow: 0 2px 8px rgba(0,0,0,.5); opacity: 0; transform: scale(.85); transition: opacity .12s, transform .12s; }
  .md-tile:hover .md-tile-add, .md-tile:focus-within .md-tile-add { opacity: 1; transform: none; }
  @media (hover: none) { .md-tile-add { opacity: 1; transform: none; } }
  .md-row[draggable="true"] { cursor: grab; }
  .md-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 2px; font-size: 13.5px; }
  .md-upload { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; }
  .md-filter { display: flex; gap: 4px; padding: 0 8px 6px; }
  .md-filter button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .md-filter button.on { color: var(--text); border-color: var(--accent); }
  .md-scene-action { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
                     margin: 0 8px 6px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 10px;
                     background: rgba(255,122,26,.08); font-size: 12.5px; }
  .md-scene-action button { background: var(--accent); color: var(--accent-ink, #1a0d00); border: 0; border-radius: 8px;
                            padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
  .md-group h4 { margin: 12px 4px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  .md-bg { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; padding: 0; font-size: 13px; }
  .md-bg:hover { border-color: var(--accent); }
  .md-row.current { background: rgba(255,122,26,.08); }
  .md-row.current b { color: var(--accent); }
  .tx-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tx-preset { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px;
               background: #07090c; border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; color: #fff; text-align: center; }
  .tx-preset:hover { border-color: var(--accent); }
  .tx-preset small { font-size: 11px; color: var(--muted); }
  .blk.scene { cursor: grab; }
  .md-tile-main { position: absolute; inset: 0; border: 0; padding: 0; background: transparent; cursor: pointer; }
  .md-tile-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity .12s; }
  .md-tile:hover .md-tile-actions, .md-tile:focus-within .md-tile-actions { opacity: 1; }
  .md-tile-actions button { width: 24px; height: 24px; border-radius: 6px; border: 0; background: rgba(0,0,0,.72); color: #fff;
                            font-size: 12px; padding: 0; line-height: 24px; }
  .md-tile-actions button:hover { background: var(--accent); color: var(--accent-ink); }
  @media (hover: none) { .md-tile-actions { opacity: 1; } }

  /* ---------- tạo dự án mới ---------- */
  .np { height: 100%; overflow-y: auto; padding: 28px 16px; }
  .np-card { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px 24px; }
  .np-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .np-head h1 { margin: 0; font-size: 20px; }
  .np-field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
  .np-field > span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .np-field input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; outline: 0; }
  .np-field input:focus { border-color: var(--line-2); }
  .np-aspects { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .np-aspects button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line);
                       border-radius: 12px; padding: 10px 6px; color: var(--text); }
  .np-aspects button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .np-aspects i { display: block; border: 2px solid var(--muted); border-radius: 3px; margin: 4px 0; }
  .np-aspects button.on i { border-color: var(--accent); }
  .np-aspects small { font-size: 11px; color: var(--muted); text-align: center; }
  .np-drop { margin-top: 16px; border: 2px dashed var(--line-2); border-radius: 16px; padding: 34px 16px; display: flex; flex-direction: column;
             align-items: center; gap: 6px; text-align: center; cursor: pointer; background: var(--bg); }
  .np-drop i { font-style: normal; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
               display: grid; place-items: center; font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .np-drop b { font-size: 16px; }
  .np-actions .ed-btn.primary { padding: 10px 20px; font-size: 14.5px; }
  .np-drop:hover, .np-drop.drag { border-color: var(--accent); background: rgba(255,122,26,.05); }
  .np-drop span { font-size: 12.5px; color: var(--muted); }
  .np-picked { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .np-picked li { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; }
  .np-picked em { font-style: normal; width: 22px; text-align: center; color: var(--accent); font-weight: 700; }
  .np-thumb { width: 46px; height: 46px; border-radius: 6px; overflow: hidden; background: #000; flex: 0 0 46px; }
  .np-thumb img, .np-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .np-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .np-picked button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); padding: 0; }
  .np-library { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 260px; overflow-y: auto; }
  .np-library button { position: relative; aspect-ratio: 1; border: 2px solid transparent; border-radius: 8px; overflow: hidden; padding: 0; background: #000; }
  .np-library button.on { border-color: var(--accent); }
  .np-library img, .np-library video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .np-library i { position: absolute; top: 3px; left: 4px; font-style: normal; font-size: 12px; }
  .np-library em { position: absolute; top: 4px; right: 4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent);
                   color: var(--accent-ink); font-style: normal; font-weight: 700; font-size: 12px; line-height: 20px; }
  .np-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .blk.scene.dragging { outline: 2px dashed #fff; outline-offset: -2px; z-index: 3; }
  .md.drag { box-shadow: inset 0 0 0 2px var(--accent); }
  .md-tabs { display: flex; padding: 8px 8px 0; gap: 4px; }
  .md-tabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 6px 4px;
                    color: var(--muted); font-size: 13px; }
  .md-tabs button.on { color: var(--text); border-color: var(--accent); }
  .md-tools { display: flex; gap: 6px; padding: 8px; }
  .md-tools input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; outline: 0; }
  .md-tools button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; white-space: nowrap; }
  .md-hint { margin: 0 10px 6px; font-size: 11.5px; color: var(--muted); }
  /* Lưới nằm trong khung cuộn có giới hạn chiều cao: hàng phải giữ kích thước theo nội dung,
     nếu không trình duyệt co các hàng lại cho vừa khung và ô ảnh bị ép dẹt, chồng lên nhau. */
  .md-grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: max-content; align-content: start;
             gap: 6px; padding: 0 8px 12px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .md-tile { position: relative; aspect-ratio: 1; min-height: 0; flex-shrink: 0; border: 1px solid var(--line);
             border-radius: 8px; overflow: hidden; background: #000; padding: 0; }
  .md-tile:hover { border-color: var(--accent); }
  .md-tile img, .md-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .md-tile i { position: absolute; top: 4px; left: 4px; font-style: normal; font-size: 12px; }
  .md-tile span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 2px 5px; text-align: left;
                  background: linear-gradient(transparent, rgba(0,0,0,.85)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md-list { overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .md-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; }
  .md-row:hover { background: var(--panel); }
  .md-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .md-row b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md-row small { font-size: 11px; color: var(--muted); }

  /* mục 💬 Phụ đề: mỗi câu một dòng */
  .cl { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .cl-bar { display: flex; gap: 6px; padding: 6px 8px; }
  .cl-bar button { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; }
  .cl-bar button.on { border-color: var(--accent); }
  .cl-bar .cl-add { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cl-paste { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 8px; }
  .cl-paste textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; resize: vertical; outline: 0; font-size: 13px; }
  .cl-paste button { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 12.5px; }
  .cl-paste button:disabled { opacity: .45; }
  .cl-err { margin: 0 8px 8px; font-size: 12px; color: #ff8a8a; }
  /* khối xác nhận sau khi chọn file phụ đề */
  .cl-import { display: flex; flex-direction: column; gap: 6px; margin: 0 8px 8px; padding: 8px 9px;
               background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; }
  .cl-import-head { display: flex; flex-direction: column; gap: 2px; margin: 0; }
  .cl-import-head b { font-size: 12.5px; font-weight: 600; word-break: break-all; }
  .cl-import-head small, .cl-note { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .cl-import label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .cl-import-foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }
  .cl-import-foot button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
                           padding: 5px 12px; font-weight: 600; font-size: 12.5px; }
  .cl-import-foot button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  /* ví dụ định dạng file */
  /* Mở ra thì cao lại và tự cuộn — không đẩy danh sách phụ đề tràn khỏi panel. */
  .cl-help { margin: 0 8px 8px; flex: 0 0 auto; }
  .cl-help[open] { flex: 0 1 auto; max-height: 55%; overflow-y: auto; }
  .cl-help summary { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; }
  .cl-help summary:hover { color: var(--text); }
  .cl-help-body { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 2px; }
  .cl-help-body p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .cl-help-body b { color: var(--text); font-weight: 600; }
  .cl-help-body pre { margin: 0; padding: 7px 9px; background: var(--bg); border: 1px solid var(--line);
                      border-radius: 8px; font-size: 11px; line-height: 1.5; white-space: pre-wrap; overflow-x: auto; }
  .cl-help-body button { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line);
                         border-radius: 8px; padding: 4px 10px; font-size: 12px; }
  .cl-help-body button:hover { border-color: var(--line-2); }
  .cl-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .cl-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 8px; border: 1px solid transparent; }
  .cl-row:hover { background: var(--panel); }
  .cl-row.playing { background: rgba(62,230,255,.07); }
  .cl-row.on { border-color: var(--accent); background: rgba(255,122,26,.08); }
  .cl-time { flex: 0 0 auto; background: transparent; border: 0; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding: 2px 4px; }
  .cl-time:hover { color: var(--text); }
  .cl-track { flex: 0 0 auto; font-size: 10px; font-weight: 600; color: var(--muted); background: var(--panel-2);
              border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; line-height: 16px; }
  .cl-text { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; font-size: 13px; outline: 0; }
  .cl-text:focus { background: var(--panel); border-color: var(--line-2); }
  .cl-del { flex: 0 0 auto; width: 24px; height: 24px; background: transparent; border: 0; border-radius: 6px; color: var(--muted); padding: 0; font-size: 12px; opacity: 0; }
  .cl-row:hover .cl-del, .cl-row.on .cl-del { opacity: 1; }
  .cl-del:hover { color: #ff8a8a; background: rgba(255,90,90,.12); }
  .md-play, .md-add { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); padding: 0; font-size: 12px; }
  .md-add { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .md-empty { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px 6px; }
  .ai { overflow-y: auto; padding: 4px 10px 14px; display: flex; flex-direction: column; gap: 10px; }
  .ai label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .ai textarea, .ai select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: 0; color: var(--text); }
  .ai textarea { resize: vertical; min-height: 92px; }
  .ai textarea:focus, .ai select:focus { border-color: var(--line-2); }
  .ai-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; }
  .ai-check { flex-direction: row !important; align-items: center; gap: 6px !important; color: var(--text) !important; }
  .ai-go { background: var(--accent); border: 0; border-radius: 9px; padding: 8px; color: var(--accent-ink); font-weight: 700; }
  .ai-note { margin: 0; font-size: 11.5px; color: var(--muted); }
  .ai-note.err { color: var(--err); white-space: pre-line; }
  .ai-result { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; }
  .ai-result video { width: 100%; max-height: 220px; display: block; }

  /* ---------- tư liệu Bilibili ---------- */
  .bl input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: 0; color: var(--text); min-width: 0; }
  .bl input:focus { border-color: var(--line-2); }
  .bl-search { display: flex; gap: 6px; }
  .bl-search input { flex: 1 1 auto; }
  .bl-search button { flex: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 12px; }
  .bl-search .ai-go { border: 0; background: var(--accent); color: var(--accent-ink); }
  .bl-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .bl-chips button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: var(--muted); }
  .bl-chips button:hover { color: var(--text); border-color: var(--line-2); }
  .bl-list { display: flex; flex-direction: column; gap: 6px; }
  .bl-item { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px; color: var(--text); }
  .bl-item:hover { border-color: var(--accent); }
  .bl-cover { position: relative; aspect-ratio: 16 / 10; border-radius: 5px; overflow: hidden; background: #000; }
  .bl-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bl-cover i { position: absolute; right: 3px; bottom: 3px; font-style: normal; font-size: 10.5px; background: rgba(0,0,0,.72); color: #fff; padding: 0 4px; border-radius: 3px; }
  .bl-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .bl-meta b { font-size: 12px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bl-meta small, .bl-title small { color: var(--muted); font-size: 11px; }
  .bl-tags { display: flex; flex-wrap: wrap; gap: 3px; }
  .bl-tags em { font-style: normal; font-size: 10.5px; color: #7ee2a8; background: rgba(46,204,113,.12); border-radius: 4px; padding: 0 5px; }
  .bl-tags em.pending { color: var(--muted); background: var(--panel); }
  .bl-more, .bl-back { align-self: flex-start; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; color: var(--text); font-size: 12px; }
  .bl-back { border: 0; padding: 2px 0; color: var(--muted); }
  .bl-back:hover { color: var(--text); }
  .bl-player { aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .bl-player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .bl-title { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .bl-title a { color: var(--muted); }
  .bl-permit { display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(46,204,113,.35); border-radius: 8px; padding: 8px; }
  .bl-permit blockquote { margin: 0; padding: 2px 0 2px 8px; border-left: 3px solid #2ecc71; font-size: 12.5px; color: var(--text); }
  .bl-permit details { font-size: 11.5px; color: var(--muted); }
  .bl-permit details p { margin: 4px 0 0; white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
  .bl-range { display: grid; grid-template-columns: 1fr 1fr 84px; gap: 6px; }
  .bl-credit { display: flex; gap: 6px; align-items: center; font-size: 11.5px; background: var(--panel-2); border-radius: 8px; padding: 6px 8px; }
  .bl-credit span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .bl-credit button, .bl-tool button { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; color: var(--text); font-size: 11px; }

  /* ---------- khung crop kiểu CapCut ---------- */
  /* Phủ cả trình chỉnh sửa như trang Crop của CapCut — khu xem trước riêng quá chật, nhất là trên điện thoại. */
  .cr { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #07090c; }
  .cr-main { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 14px; padding: 14px; min-height: 0; }
  /* container size: khung ảnh gốc co theo cả chiều rộng lẫn chiều cao còn trống */
  .cr-src { container-type: size; position: relative; display: grid; place-items: center; min-width: 0; min-height: 220px; }
  .cr-media { position: relative; width: min(100cqw, calc(100cqh * var(--ar, 1))); aspect-ratio: var(--ar, 1);
              overflow: hidden; background: #000; touch-action: none; user-select: none; }
  .cr-media img, .cr-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  .cr-rect { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.58); outline: 1.5px solid #fff; cursor: move; }
  .cr-grid { position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),
        transparent calc(33.33% + .5px) calc(66.66% - .5px), rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),
        transparent calc(33.33% + .5px) calc(66.66% - .5px), rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  .cr-h { position: absolute; background: #fff; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .cr-h::after { content: ""; position: absolute; inset: -10px; } /* vùng bấm rộng hơn hình vẽ */
  .cr-h.tl, .cr-h.tr, .cr-h.bl, .cr-h.br { width: 16px; height: 16px; }
  /* Tay kéo nằm TRONG mép vùng: vùng phủ kín ảnh thì phần ngoài mép bị cắt, không bấm được. */
  .cr-h.tl { left: 0; top: 0; cursor: nwse-resize; }
  .cr-h.br { right: 0; bottom: 0; cursor: nwse-resize; }
  .cr-h.tr { right: 0; top: 0; cursor: nesw-resize; }
  .cr-h.bl { left: 0; bottom: 0; cursor: nesw-resize; }
  .cr-h.t, .cr-h.b { width: 28px; height: 6px; left: calc(50% - 14px); cursor: ns-resize; }
  .cr-h.t { top: 0; }
  .cr-h.b { bottom: 0; }
  .cr-h.l, .cr-h.r { width: 6px; height: 28px; top: calc(50% - 14px); cursor: ew-resize; }
  .cr-h.l { left: 0; }
  .cr-h.r { right: 0; }
  .cr-msg { position: absolute; margin: 0; color: var(--muted); font-size: 13px; }
  .cr-msg.err { color: var(--err); }
  .cr-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; font-size: 11.5px; color: var(--muted); }
  .cr-side b { color: var(--text); font-size: 12.5px; }
  .cr-preview { width: 100%; max-height: 62%; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cr-tools { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .cr-ratios, .cr-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cr-tools button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
  .cr-tools button.on { border-color: var(--accent); color: var(--accent); }
  .cr-tools button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cr-rotate { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .cr-rotate input { width: 120px; accent-color: var(--accent); }
  .cr-rotate output { min-width: 40px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cr-fit { display: inline-flex; }
  .cr-fit button:first-child { border-radius: 8px 0 0 8px; }
  .cr-fit button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
  .cr-spacer { flex: 1; }
  @media (max-width: 720px) {
    .cr-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .cr-side { flex-direction: row; align-items: center; }
    .cr-preview { width: 90px; flex: 0 0 90px; max-height: none; }
  }

  /* ---------- bảng thuộc tính ---------- */
  .in { display: flex; flex-direction: column; min-height: 100%; }
  .in-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 14px;
             background: var(--panel); }
  .in-head b { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .in-head b i { font-style: normal; width: 24px; height: 24px; border-radius: 7px; background: var(--panel-2); display: grid; place-items: center; font-size: 13px; }
  .in-close { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); padding: 0; }
  .in-close:hover { background: var(--panel-2); color: var(--text); }
  .in-tabs { position: sticky; top: 42px; z-index: 3; display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line);
             background: var(--panel); overflow-x: auto; scrollbar-width: none; }
  .in-tabs::-webkit-scrollbar { display: none; }
  .in-tabs button { flex: 0 0 auto; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 7px 8px 8px;
                    color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .in-tabs button:hover { color: var(--text); }
  .in-tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .in-body { flex: 1; padding-bottom: 16px; }
  .in-body .in-sec h3 { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .in-footer { position: sticky; bottom: 0; z-index: 3; background: var(--panel); border-top: 1px solid var(--line); }
  .in-footer .in-sec { border-bottom: 0; padding: 10px 14px; }
  .in-sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .in-sec h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .in-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .in-label { font-size: 12px; color: var(--muted); }
  .in-hint { font-size: 11px; color: var(--muted); opacity: .85; }
  .in-field input:not([type=range]):not([type=color]), .in-field select, .in-field textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: 0; width: 100%; }
  .in-field input:focus, .in-field select:focus, .in-field textarea:focus { border-color: var(--line-2); }
  .in-field textarea { resize: vertical; }
  .in-field input[type=color] { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px; }
  .in-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .in-range { display: flex; align-items: center; gap: 8px; }
  .in-range input { flex: 1; accent-color: var(--accent); }
  .in-range b { font-size: 12px; font-weight: 500; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .in-check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0 10px; }
  .in-check input { accent-color: var(--accent); }
  .in-note { font-size: 12px; color: var(--muted); margin: 4px 0 10px; word-break: break-all; }
  .in-media { aspect-ratio: 16 / 10; background: #000; border-radius: 8px; overflow: hidden; display: grid; place-items: center;

  /* ---------- timeline ---------- */
  .tl { height: 300px; max-height: 46vh; border-top: 1px solid var(--line); display: flex; flex-direction: column; background: #111215; }
  .tl-bar { display: flex; align-items: center; gap: 2px; padding: 5px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap;

             border-radius: 8px; padding: 0 9px; font-size: 12.5px; color: var(--text); white-space: nowrap; }
  .tl-tool:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
  .tl-tool:disabled { opacity: .35; }
  /* nút đang bật: đầu phát đứng đúng một mốc chuyển động (◆ tô đặc) */
  .tl-tool.on { color: var(--accent); background: rgba(255,122,26,.12); border-color: rgba(255,122,26,.45); }
  .tl-sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

  .tl-drop-note { font-size: 12px; color: var(--accent); margin-right: 8px; }

  .tl-label { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid #1a1b1f; }

  .tl-label.main { height: 64px; color: var(--text); font-weight: 600; }
  .tl-label.ruler { height: 26px; }
  .tl-tracks { position: relative; flex: 0 0 auto; user-select: none; touch-action: none; }
  .tl-ruler { height: 26px; position: relative; border-bottom: 1px solid var(--line); cursor: ew-resize;
              background-image: linear-gradient(to right, #1d222b 1px, transparent 1px); }
  .tick { position: absolute; top: 4px; font-size: 10.5px; color: var(--muted); padding-left: 3px; border-left: 1px solid var(--line-2); height: 16px; line-height: 16px; }
  .tl-row { height: 38px; position: relative; border-bottom: 1px solid #1a1b1f; cursor: text; }
  .tl-row.main { height: 64px; background: rgba(255,255,255,.015); }
  .tl-row.voice { height: 38px; }
  .blk { position: absolute; top: 4px; bottom: 4px; border-radius: 7px; overflow: hidden; display: flex; align-items: center;
         font-size: 12px; color: #fff; border: 1px solid rgba(255,255,255,.14); cursor: grab; box-sizing: border-box; }
  .blk:active { cursor: grabbing; }
  .blk span { position: relative; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
              text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  /* Mục đang chọn: viền trắng dày như CapCut */
  .blk.on { border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.45); z-index: 2; }
  .blk.scene { background: var(--c-scene); cursor: pointer; top: 3px; bottom: 3px; align-items: flex-end; }
  .blk-film { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;
              background-repeat: repeat-x; background-size: auto 100%; background-position: left center; }
  .blk.scene::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.7)); pointer-events: none; z-index: 1; }
  .blk-name { z-index: 2; padding-bottom: 4px !important; font-size: 11.5px; font-weight: 600; }
  .blk.caption { background: var(--c-caption); }
  .blk.voice { background: var(--c-voice); cursor: pointer; }
  .blk .wave { position: absolute; inset: 8px 6px; padding: 0; background:
      repeating-linear-gradient(90deg, rgba(159,227,207,.75) 0 2px, transparent 2px 5px);
      -webkit-mask: linear-gradient(transparent 20%, #000 20% 80%, transparent 80%); mask: radial-gradient(ellipse at center, #000 55%, transparent 75%); }
  .blk.music { background: var(--c-music); cursor: pointer; }
  .blk.clip { background: var(--c-clip); }
  .blk.text { background: #8a3f5c; }
  .tl-label.text { color: #e3a3bd; }
  /* lớp video chồng: hàng nằm trên track chính, khối có hình thu nhỏ như khối cảnh */
  .tl-row.overlay-row { background: rgba(120,170,255,.035); }
  .tl-row.overlay-row.lift { background: rgba(255,122,26,.16); box-shadow: inset 0 0 0 1px var(--accent); }
  .tl-label.overlay { color: #a8c6ef; }
  .blk.overlay { background: var(--c-overlay); }
  .blk.overlay .blk-film { opacity: .55; }
  .blk.overlay span { z-index: 2; font-size: 11.5px; font-weight: 600; }
  .blk.scene.lifting { opacity: .45; outline: 2px dashed var(--accent); outline-offset: -2px; }
  .h { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 3; }
  .h.l { left: 0; }
  .h.r { right: 0; }
  .h::after { content: ""; position: absolute; top: 25%; bottom: 25%; left: 3px; width: 2px; border-radius: 1px; background: rgba(255,255,255,.55); }
  .blk:not(:hover):not(.on) .h::after { opacity: 0; }
  .tl-empty { position: absolute; left: 8px; top: 6px; background: transparent; border: 1px dashed var(--line-2); border-radius: 6px;
              color: var(--muted); font-size: 12px; padding: 3px 10px; }
  .tl-hint { position: absolute; left: 10px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .tl-playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 4;

  .tl-playhead i { position: absolute; top: 0; left: -6px; width: 14px; height: 16px; background: #fff; border-radius: 3px 3px 0 0;

  .tl-drop { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; z-index: 4;

  /* ---------- keyframe (mốc chuyển động của lớp đè) ---------- */
  .blk .kf { position: absolute; bottom: 3px; width: 9px; height: 9px; margin-left: -4.5px; background: #fff;

  .stage-pip.moving { outline-style: dashed; }
  /* Khung của cảnh trên track chính: viền vàng để phân biệt với lớp đè (viền xanh). */
  .stage-pip.stage-scene.on { outline-color: #ffd166; }

  .stage-pip.stage-scene .stage-pip-rot::after { border-color: #8a6a1f; border-top-color: transparent; }
  .kf-list { display: flex; flex-direction: column; gap: 3px; margin: 6px 0 2px; max-height: 190px; overflow-y: auto; }
  .kf-row { display: flex; align-items: baseline; gap: 8px; text-align: left; background: var(--bg);
            border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; color: var(--text); }
  .kf-row b { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kf-row span { font-size: 11.5px; color: var(--muted); }
  .kf-row:hover { border-color: var(--line-2); }
  .kf-row.on { border-color: var(--accent); background: rgba(255,122,26,.08); }

  /* ---------- thông báo & hộp thoại ---------- */
  .ed-toast { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line-2);
              border-radius: 10px; padding: 8px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 20; max-width: 90vw; }
  .ed-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 30; padding: 16px; }
  .ed-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; width: min(460px, 100%); }
  .ed-card h3 { margin: 0 0 12px; font-size: 17px; }
  .ed-progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .ed-progress div { height: 100%; background: var(--accent); transition: width .25s; }
  .ed-result { width: 100%; max-height: 50vh; background: #000; border-radius: 10px; margin-bottom: 12px; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--err); white-space: pre-wrap; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .ed { height: auto; min-height: 100%; }
    .ed-main { grid-template-columns: 1fr; }
    .ed-stage { height: 56vh; }
    .md, .ed-insp { border: 0; border-top: 1px solid var(--line); max-height: 380px; }

    .tl-tool span { display: none; }
  }
</style>
